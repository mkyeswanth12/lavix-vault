[project]
name = "lavix-vault"
version = "0.9.49-beta"
description = "Privacy-first encrypted vault with local document ingestion and agentic RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt==4.3.0",
    "cryptography==49.0.0",
    "email-validator==2.3.0",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "minio==7.2.20",
    "neo4j==5.28.2",
    "psutil==7.2.2",
    "psycopg[binary]==3.3.4",
    "psycopg_pool==3.2.4",
    "pydantic==2.13.4",
    "python-jose[cryptography]==3.5.0",
    "python-magic==0.4.27",
    "python-multipart==0.0.32",
    "redis==8.0.1",
    "requests==2.34.2",
    "trafilatura==2.1.0",
    "tzdata==2026.3",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
worker = [
    "docling-slim[convert-core,format-html,format-office,format-pdf,models-local]==2.112.0",
    "opencv-python-headless==4.13.0.92",
    "opendataloader-pdf==2.4.7",
    "torch==2.9.1+cpu; sys_platform == 'linux'",
    "torchvision==0.24.1+cpu; sys_platform == 'linux'",
]
dev = [
    "httpx2==2.7.0",
    "pypdfium2==5.11.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
markers = [
    "contract: stable HTTP and SSE contract tests",
    "integration: tests requiring disposable service containers",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["open-webui", "webui/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
