server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;

    # The app is self-contained except for Google Fonts. Blob URLs are required
    # for authenticated document previews; PDF.js runs from a same-origin worker.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Custom error pages for backend proxy failures
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Built assets with content hashes — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # pdfjs-dist ships its module worker as .mjs. Alpine's stock mime.types
    # does not map that extension, and browsers reject module workers served
    # as application/octet-stream when nosniff is enabled.
    location ~* ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SVG icons — cache for a week
    location /svg/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA routing — never cache index.html so new asset hashes take effect
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Preserve streaming semantics for the chat SSE endpoint.
    location = /api/ai/chat {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # API proxy to backend
    location /api {
        # Leaves multipart overhead above the API's 512 MiB file limit.
        client_max_body_size 520m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets this on file responses; keep the server-level header as
        # the single browser-facing value instead of forwarding a duplicate.
        proxy_hide_header X-Content-Type-Options;

        # Extended timeouts for AI processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Buffer large API responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 64 16k;
        proxy_busy_buffers_size 128k;
    }
}
